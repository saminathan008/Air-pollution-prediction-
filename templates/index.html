<!DOCTYPE html>
<html>
<head>

    <title>Air Pollution Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #1f4e79;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5a;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: #e8f5e9;
            border-radius: 10px;
        }

        .aqi {
            font-size: 35px;
            font-weight: bold;
            color: #1f4e79;
        }

        .category {
            font-size: 22px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🌍 Air Pollution Prediction</h1>

    <p class="subtitle">
        Machine Learning Based AQI Prediction System
    </p>

    <form method="POST">

        <div class="form-grid">

            <div>
                <label>PM2.5</label>
                <input type="number" step="any" name="pm25" required>
            </div>

            <div>
                <label>PM10</label>
                <input type="number" step="any" name="pm10" required>
            </div>

            <div>
                <label>NO2</label>
                <input type="number" step="any" name="no2" required>
            </div>

            <div>
                <label>SO2</label>
                <input type="number" step="any" name="so2" required>
            </div>

            <div>
                <label>CO</label>
                <input type="number" step="any" name="co" required>
            </div>

            <div>
                <label>O3</label>
                <input type="number" step="any" name="o3" required>
            </div>

            <div>
                <label>Temperature (°C)</label>
                <input type="number" step="any" name="temperature" required>
            </div>

            <div>
                <label>Humidity (%)</label>
                <input type="number" step="any" name="humidity" required>
            </div>

        </div>

        <button type="submit">
            Predict AQI
        </button>

    </form>


    {% if prediction is not none %}

    <div class="result">

        <h2>Prediction Result</h2>

        <div class="aqi">
            AQI: {{ "%.2f"|format(prediction) }}
        </div>

        <div class="category">
            Category: {{ category }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
